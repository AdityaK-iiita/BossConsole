syntax = "proto3";

package boss.ipc.v1.services;

import "boss/ipc/v1/common.proto";

option java_package = "ai.rever.boss.ipc.proto.services";
option java_multiple_files = true;

// ContextMenuService is the intended shape of out-of-process context menus: since
// Compose modifiers cannot be serialized over gRPC, a plugin would register menu item
// descriptors and the kernel would attach them to the matching UI nodes.
//
// NOT IMPLEMENTED (BossConsole issue #30). The kernel-side ContextMenuServiceBridge
// acknowledges and drops every call: nothing renders these items, because a rendered
// widget node has no context-menu attachment point and there is no kernel -> plugin
// event to deliver a picked action. Wiring it up means extending the UI protocol
// (WidgetModifier + a context-menu UIEvent), not just implementing the bridge. The
// service stays declared so plugin-side proxies get OK instead of UNIMPLEMENTED.
service ContextMenuService {
  // Register a context menu with one or more items for a given UI node.
  // Currently accepted and discarded by the kernel.
  rpc RegisterContextMenu(RegisterContextMenuRequest) returns (boss.ipc.v1.Empty);

  // Unregister a previously registered context menu. No-op while registration is a no-op.
  rpc UnregisterContextMenu(ContextMenuIdRequest) returns (boss.ipc.v1.Empty);

  // Report that a context menu action was triggered. Note the direction: like the rest
  // of this service it is plugin -> kernel, so it cannot notify a plugin of a user click
  // (that would need a kernel -> plugin UIEvent). Accepted and discarded.
  rpc OnContextMenuAction(ContextMenuActionRequest) returns (boss.ipc.v1.Empty);
}

// ---- Messages ----

message RegisterContextMenuRequest {
  string context_menu_id = 1;
  string node_id = 2;
  repeated ContextMenuItemProto items = 3;
}

message ContextMenuItemProto {
  string label = 1;
  string action_id = 2;
  string icon_name = 3;
  bool enabled = 4;
  bool separator_before = 5;
}

message ContextMenuIdRequest {
  string context_menu_id = 1;
}

message ContextMenuActionRequest {
  string context_menu_id = 1;
  string action_id = 2;
}
